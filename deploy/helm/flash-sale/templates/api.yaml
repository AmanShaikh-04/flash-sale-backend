apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  # With an HPA, replicas is left unset so a re-sync never fights the autoscaler.
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: {{ include "fs.redisUrl" . | quote }}
            - name: SQS_ENDPOINT
              value: {{ include "fs.sqsEndpoint" . | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Give Service endpoints a few seconds to drop this pod before SIGTERM arrives.
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
