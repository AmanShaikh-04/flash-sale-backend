apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SQS_ENDPOINT
              value: {{ include "fs.sqsEndpoint" . | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flash-sale-db
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
