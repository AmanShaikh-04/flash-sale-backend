# Database credentials. This is the local stand-in for Secrets Manager (Phase 5).
apiVersion: v1
kind: Secret
metadata:
  name: flash-sale-db
  labels:
    {{- include "fs.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "fs.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  {{- end }}
