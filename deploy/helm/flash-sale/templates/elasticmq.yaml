{{- if .Values.elasticmq.enabled }}
# Local stand-in for SQS. The app creates the orders and orders-dlq queues on startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: {{ .Values.elasticmq.image }}
          ports:
            - containerPort: 9324
          readinessProbe:
            tcpSocket:
              port: 9324
            periodSeconds: 3
          resources:
            {{- toYaml .Values.elasticmq.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  selector:
    app: elasticmq
  ports:
    - port: 9324
      targetPort: 9324
{{- end }}
