name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STOCK: "100"
      COMPOSE_PROFILES: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Start infra
        run: |
          docker compose up -d --wait redis postgres elasticmq
          sleep 5

      - name: Seed (stock = ${{ env.STOCK }})
        run: npx tsx scripts/seed.ts

      - name: Build and start api + worker
        run: docker compose up -d --build api worker

      - name: Wait for api and worker
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/stock && break
            sleep 2
          done
          curl -sf http://localhost:3000/stock || { echo "API did not come up"; exit 1; }
          timeout 60 bash -c 'until docker compose logs worker 2>&1 | grep -q "worker started"; do sleep 1; done'

      - name: Load test (1000 requests)
        run: |
          docker run --rm -i --network host -e TOTAL=1000 -e VUS=50 \
            grafana/k6 run - < scripts/k6-buy.js

      - name: Closing wave (keep buyers coming until sold out)
        run: |
          # A failed payment can release a unit after the burst ends. A real sale keeps taking
          # buyers until it is sold out, so send paced buyers until stock stays at 0.
          zero=0
          for i in $(seq 1 100); do
            stock=$(curl -sf http://localhost:3000/stock | jq -r .stock)
            if [ "$stock" = "0" ]; then zero=$((zero+1)); else zero=0; fi
            [ "$zero" -ge 3 ] && break
            curl -s -o /dev/null -X POST http://localhost:3000/buy \
              -H 'Content-Type: application/json' \
              -d "{\"userId\":\"closer$i\",\"idempotencyKey\":\"closer-$i\"}"
            sleep 0.3
          done
          curl -sf http://localhost:3000/stock

      - name: Let the worker drain the queue
        run: sleep 15

      - name: Verify no overselling
        run: npx tsx scripts/verify.ts

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    needs: [check, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # image names must be lowercase, so owner/repo names are written out
          images: ghcr.io/amanshaikh-04/flash-sale-${{ matrix.target }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}