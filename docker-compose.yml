services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flashsale
    ports:
      - "5432:5432"

  elasticmq:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"   # SQS API
      - "9325:9325"   # web UI